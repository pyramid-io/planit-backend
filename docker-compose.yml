services:
  app:
    build: 
      context: .
      dockerfile: ./config/docker/app/Dockerfile
    container_name: planit-api
    volumes: 
      - ./:/var/www/
      - ./config/docker/app/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    ports:
      - "${SERVER_PORT}:8080"
    entrypoint: /usr/local/bin/entrypoint.sh
    networks:
      - planit-network
  nginx:
    image: nginx:alpine
    container_name: planit-api-webserver
    environment:
      - SERVER_PORT=${SERVER_PORT}
    ports:
      - "80:80"
    volumes: 
      - ./config/docker/nginx/conf.d/:/etc/nginx/conf.d/
      - ./config/docker/nginx/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    depends_on:
      - app
    entrypoint: /usr/local/bin/entrypoint.sh
    networks:
      - planit-network
  db:
    image: mysql
    container_name: planit-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_API_USER}
      MYSQL_DATABASE: ${MYSQL_API_DATABASE}
      MYSQL_USER: ${MYSQL_API_USER}
      MYSQL_PASSWORD: ${MYSQL_API_PASSWORD}
    ports:
      - 3306:3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/docker/db/docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d/
      - ./config/db/my.cnf:/etc/mysql/my.cnf
    restart: always
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    networks:
      - planit-network
networks:
  planit-network:
    driver: bridge
volumes:
    mysql_data: